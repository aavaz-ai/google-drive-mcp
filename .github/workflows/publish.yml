name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Ensure npm supports OIDC trusted publishing and provenance attestations.
      - name: Upgrade npm
        run: npm i -g npm@11.17.0 && npm --version

      # Kill any token-based auth that might exist (repo .npmrc, runner ~/.npmrc, etc.)
      - name: Ensure no npm token auth is configured
        run: |
          rm -f .npmrc || true
          rm -f ~/.npmrc || true
          npm config delete //registry.npmjs.org/:_authToken || true
          npm config delete _authToken || true
          npm config set registry https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      # Pack once so validation and publication operate on identical bytes.
      - name: Pack release artifact
        id: package
        run: |
          mkdir release-artifact
          tarball_name="$(npm pack --pack-destination release-artifact | tail -n 1)"
          test -n "$tarball_name"
          test -f "release-artifact/$tarball_name"
          echo "tarball=release-artifact/$tarball_name" >> "$GITHUB_OUTPUT"

      - name: Smoke exact release artifact
        run: node scripts/packed-npx-smoke.mjs "${{ steps.package.outputs.tarball }}"

      - name: Publish exact artifact with provenance
        run: npm publish "${{ steps.package.outputs.tarball }}" --provenance --access public
